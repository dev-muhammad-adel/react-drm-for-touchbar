<title>react-drm preview</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #1b1b1d;
    font: 13px -apple-system, system-ui, sans-serif;
    color: #9a9a9e;
  }
  canvas {
    width: min(90vw, 1600px);
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    border-radius: 20px;
    touch-action: none;
    cursor: pointer;
  }
  #status { opacity: 0.8; }
  #status.connected { color: #6fcf6f; }
  #status.disconnected { color: #e07a5f; }
</style>
<canvas id="touchbar" width="2008" height="60"></canvas>
<div id="status">connecting…</div>
<script>
  // Displays the ACTUAL Cairo-rendered Touch Bar framebuffer streamed from
  // native/src/binding.cpp's PreviewDisplay — this page draws no UI of its
  // own, it only blits the bytes it receives and forwards input back.
  const HEADER_BYTES = 16; // width, height, stride, format — uint32 LE each
  const FORMAT_RGBA8888 = 1;

  const canvas = document.getElementById('touchbar');
  const status = document.getElementById('status');
  const ctx = canvas.getContext('2d');

  let ws = null;

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.binaryType = 'arraybuffer';

    ws.addEventListener('open', () => {
      status.textContent = `connected — ${canvas.width}×${canvas.height}`;
      status.className = 'connected';
    });
    ws.addEventListener('close', () => {
      status.textContent = 'disconnected — retrying…';
      status.className = 'disconnected';
      setTimeout(connect, 1000);
    });
    ws.addEventListener('error', () => ws.close());
    ws.addEventListener('message', onFrame);
  }

  function onFrame(ev) {
    if (!(ev.data instanceof ArrayBuffer) || ev.data.byteLength < HEADER_BYTES) return;
    const view = new DataView(ev.data);
    const width  = view.getUint32(0, true);
    const height = view.getUint32(4, true);
    const stride = view.getUint32(8, true);
    const format = view.getUint32(12, true);
    if (format !== FORMAT_RGBA8888) return;

    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
      status.textContent = `connected — ${width}×${height}`;
    }

    const src = new Uint8Array(ev.data, HEADER_BYTES);
    const rgba = new Uint8ClampedArray(width * height * 4);
    if (stride === width * 4) {
      rgba.set(src.subarray(0, rgba.length));
    } else {
      // Defensive path — PreviewDisplay always packs rows tightly today, but
      // don't assume it forever: honor stride like a real framebuffer would.
      for (let y = 0; y < height; y++) {
        rgba.set(src.subarray(y * stride, y * stride + width * 4), y * width * 4);
      }
    }
    ctx.putImageData(new ImageData(rgba, width, height), 0, 0);
  }

  // ── Input: browser canvas px → logical Touch Bar px → WebSocket ──────────
  function toLogical(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = Math.round((clientX - rect.left) * (canvas.width / rect.width));
    const y = Math.round((clientY - rect.top) * (canvas.height / rect.height));
    return [
      Math.max(0, Math.min(canvas.width - 1, x)),
      Math.max(0, Math.min(canvas.height - 1, y)),
    ];
  }

  function sendTouch(type, clientX, clientY) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const [x, y] = toLogical(clientX, clientY);
    ws.send(JSON.stringify({ type, x, y }));
  }

  let mouseDown = false;
  canvas.addEventListener('mousedown', (e) => { mouseDown = true; sendTouch('touchstart', e.clientX, e.clientY); });
  window.addEventListener('mousemove', (e) => { if (mouseDown) sendTouch('touchmove', e.clientX, e.clientY); });
  window.addEventListener('mouseup',   (e) => { if (mouseDown) { mouseDown = false; sendTouch('touchend', e.clientX, e.clientY); } });

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.changedTouches[0]; sendTouch('touchstart', t.clientX, t.clientY); }, { passive: false });
  canvas.addEventListener('touchmove',  (e) => { e.preventDefault(); const t = e.changedTouches[0]; sendTouch('touchmove',  t.clientX, t.clientY); }, { passive: false });
  canvas.addEventListener('touchend',   (e) => { e.preventDefault(); const t = e.changedTouches[0]; sendTouch('touchend',   t.clientX, t.clientY); }, { passive: false });

  connect();
</script>
