<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Touch Bar Config</title>
  <link rel="stylesheet" href="renderer.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <svg id="app-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="9" width="20" height="6" rx="2" stroke="currentColor" stroke-width="1.5" />
          <line x1="6" y1="10.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.25" />
          <line x1="9.5" y1="10.5" x2="9.5" y2="13.5" stroke="currentColor" stroke-width="1.25" />
          <line x1="13" y1="10.5" x2="13" y2="13.5" stroke="currentColor" stroke-width="1.25" />
          <line x1="16.5" y1="10.5" x2="16.5" y2="13.5" stroke="currentColor" stroke-width="1.25" />
        </svg>
        <span id="app-title">Touch Bar Config</span>
      </div>
      <div id="search-wrap">
        <input id="search-input" type="text" placeholder="Search settings…" autocomplete="off" />
      </div>
      <nav id="nav" aria-label="Config sections"></nav>
    </aside>
    <div id="main">
      <header id="topbar">
        <div id="topbar-drag"></div>
        <span id="status"></span>
        <button id="save-btn" type="button">Save</button>
        <button id="restart-btn" type="button" class="secondary" style="display:none;">Restart touch bar service</button>
        <div id="window-controls">
          <button id="win-minimize" type="button" class="win-btn" aria-label="Minimize">
            <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <button id="win-maximize" type="button" class="win-btn" aria-label="Maximize">
            <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
          </button>
          <button id="win-close" type="button" class="win-btn win-btn-close" aria-label="Close">
            <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </div>
      </header>
      <div id="content-scroll">
        <main id="content"></main>
      </div>
    </div>
  </div>
  <script type="module" src="renderer.js"></script>
</body>
</html>
