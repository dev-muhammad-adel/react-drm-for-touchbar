# Keep the config-1 firmware drivers out of the initramfs.
#
# dracut pulls dkms modules into the image for present hardware, and the
# iBridge's ACPI alias (APP7777) resolves to apple_ibridge. An early-boot
# alias load happens inside the initramfs, where it can pre-empt the display
# mode entirely: apple_ibridge's config-1 HID bindings and power management
# make the T1 bounce between configuration 1 and 2 in an endless reset loop,
# so apple_dfr_cfgsel never gets a stable display interface. Omit the modules
# outright — blacklists alone only cover loads once the real root is up.
omit_drivers+=" apple_ibridge apple_touchbar "
