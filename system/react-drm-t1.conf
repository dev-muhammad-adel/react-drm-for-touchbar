# react-drm hardware profile — Apple T1/iBridge (MacBookPro13,x/14,x).
# Requires a T1-capable appletbdrm and apple_dfr_cfgsel.

REACT_DRM_TB_BACKLIGHT_NAMES=display-pipe
REACT_DRM_DISP_BACKLIGHT_NAMES=gmux_backlight,apple-panel-bl,intel_backlight,acpi_video0
REACT_DRM_DRM_DRIVER=appletbdrm
REACT_DRM_USB_VENDOR=05ac
REACT_DRM_USB_PRODUCT=8600
REACT_DRM_USB_BRIDGE=pxa2xx-spi,spi-APP000D

# T1 uses small damage updates instead of overrunning the full-frame USB path.
REACT_DRM_FLUSH_FPS=30
REACT_DRM_PARTIAL_FLUSH=1
