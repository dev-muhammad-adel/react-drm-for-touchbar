PACKAGE_NAME="react-drm-t1"
PACKAGE_VERSION="1.0"

MAKE[0]="make KVER=${kernelver} KDIR=/lib/modules/${kernelver}/build"
CLEAN="make clean KVER=${kernelver} KDIR=/lib/modules/${kernelver}/build"

BUILT_MODULE_NAME[0]="apple_dfr_cfgsel"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Same module name as the in-tree driver on purpose: depmod's default
# search order prefers updates/ over kernel/, so this build (which knows
# the T1 id 05ac:8600) overrides the in-tree appletbdrm.ko.
BUILT_MODULE_NAME[1]="appletbdrm"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="apple_ibridge"
DEST_MODULE_LOCATION[2]="/updates/dkms"

AUTOINSTALL="yes"
